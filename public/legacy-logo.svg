<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 160" width="100%" height="100%">
  <defs>
    <!-- Curve for arched LEGACY SCHOOL text -->
    <path id="archPath" d="M 30,110 A 65,65 0 0,1 150,110" fill="none" />
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Left Emblem: Circular Arch & Flying Peace Dove with Olive Branch -->
  <g transform="translate(10, 10)">
    <!-- Arched Text -->
    <text font-family="'Inter', 'Arial Black', sans-serif" font-size="13" font-weight="900" fill="#1e3a8a" letter-spacing="3.5">
      <textPath href="#archPath" startOffset="50%" text-anchor="middle">
        LEGACY SCHOOL
      </textPath>
    </text>

    <!-- Flying Dove with Olive Branch -->
    <g transform="translate(48, 48) scale(0.68)">
      <!-- Olive Branch in Beak -->
      <path d="M 88,68 Q 98,62 108,66 Q 118,72 125,70" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" />
      <!-- Leaves -->
      <path d="M 98,63 Q 102,56 106,62 C 103,66 99,66 98,63 Z" fill="#16a34a" />
      <path d="M 108,65 Q 114,58 117,64 C 114,68 109,68 108,65 Z" fill="#22c55e" />
      <path d="M 118,70 Q 124,65 127,71 C 123,74 119,74 118,70 Z" fill="#16a34a" />

      <!-- Dove Body & Head -->
      <!-- Head -->
      <path d="M 72,55 C 76,46 84,46 88,52 C 92,58 90,66 82,70 C 76,73 70,70 68,64 Z" fill="#ffffff" stroke="#1e3a8a" stroke-width="2.2" />
      <!-- Beak -->
      <path d="M 88,57 L 96,62 L 87,65 Z" fill="#f59e0b" stroke="#d97706" stroke-width="1" />
      <!-- Eye -->
      <circle cx="82" cy="55" r="2" fill="#1e3a8a" />

      <!-- Upraised Left Wing (Layered Feathers) -->
      <path d="M 64,62 C 58,40 54,20 38,10 C 35,26 40,42 46,55 C 38,42 32,32 20,24 C 22,38 28,52 36,63 C 28,52 20,44 10,40 C 14,55 24,66 34,74 C 44,82 58,82 64,74 Z"
            fill="#ffffff" stroke="#1e3a8a" stroke-width="2.2" stroke-linejoin="round" />

      <!-- Body / Belly -->
      <path d="M 68,64 C 62,75 52,86 38,92 C 48,96 60,94 72,86 C 80,78 84,70 82,66 Z" fill="#ffffff" stroke="#1e3a8a" stroke-width="2.2" />

      <!-- Tail Feathers -->
      <path d="M 38,92 C 26,96 12,98 2,100 C 12,104 26,102 36,98 C 24,106 14,110 4,114 C 18,114 32,108 42,100 Z"
            fill="#ffffff" stroke="#1e3a8a" stroke-width="2.2" stroke-linejoin="round" />

      <!-- Wing Texture Lines -->
      <path d="M 44,30 Q 50,45 52,58" fill="none" stroke="#94a3b8" stroke-width="1.2" />
      <path d="M 30,42 Q 38,55 42,66" fill="none" stroke="#94a3b8" stroke-width="1.2" />
      <path d="M 22,58 Q 30,68 36,75" fill="none" stroke="#94a3b8" stroke-width="1.2" />
    </g>
  </g>

  <!-- Center Branding -->
  <g transform="translate(180, 25)">
    <!-- School Title: Bold Heavyweight Royal Blue -->
    <text x="0" y="55" font-family="'Arial Black', 'Montserrat', 'Impact', sans-serif" font-size="48" font-weight="900" fill="#1e3a8a" letter-spacing="1.5">
      LEGACY SCHOOL
    </text>

    <!-- School Motto: Flowing Cursive / Italic Script -->
    <text x="4" y="88" font-family="'Brush Script MT', 'Lucida Handwriting', 'Segoe Script', 'Georgia', cursive, italic" font-size="24" font-weight="600" font-style="italic" fill="#2563eb">
      We Strive for Your Academic and Moral Excellence
    </text>

    <!-- Fine Dual Separator Line -->
    <line x1="2" y1="100" x2="480" y2="100" stroke="#1e3a8a" stroke-width="1.8" />
    <line x1="2" y1="103" x2="480" y2="103" stroke="#93c5fd" stroke-width="0.8" />

    <!-- Official Postal & Physical Address -->
    <text x="4" y="120" font-family="'Inter', sans-serif" font-size="12.5" font-weight="600" fill="#334155" letter-spacing="0.3">
      Plot No. 889, 890 Kansanshi Road, Mushitala  •  P.O Box 110558, Solwezi – Zambia
    </text>

    <!-- Contacts Row -->
    <text x="4" y="138" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#1e40af">
      Cell: 0968/0955 441 441   •   Email: legacyschool208@gmail.com
    </text>
  </g>

  <!-- Right: Tilted Academic Graduation Cap (Mortarboard) -->
  <g transform="translate(710, 20)">
    <!-- Cap Diamond / Top Plate -->
    <polygon points="55,8 110,28 55,48 0,28" fill="#1e293b" stroke="#0f172a" stroke-width="2" />
    <polygon points="55,10 106,28 55,46 4,28" fill="#334155" />

    <!-- Skull Cap Underneath -->
    <path d="M 22,34 L 22,54 Q 55,70 88,54 L 88,34 Q 55,48 22,34 Z" fill="#0f172a" stroke="#0f172a" stroke-width="1.5" />

    <!-- Cap Button on Top -->
    <circle cx="55" cy="28" r="4.5" fill="#f59e0b" />

    <!-- Golden Tassel hanging to the right -->
    <path d="M 55,28 Q 78,32 94,52 Q 98,68 100,82" fill="none" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" />
    <!-- Tassel Fringe -->
    <path d="M 96,82 L 104,82 L 108,105 L 92,105 Z" fill="url(#goldGrad)" stroke="#b45309" stroke-width="1" />
    <line x1="94" y1="105" x2="94" y2="114" stroke="#d97706" stroke-width="1.5" />
    <line x1="97" y1="105" x2="97" y2="116" stroke="#f59e0b" stroke-width="1.5" />
    <line x1="100" y1="105" x2="100" y2="117" stroke="#fbbf24" stroke-width="1.5" />
    <line x1="103" y1="105" x2="103" y2="115" stroke="#f59e0b" stroke-width="1.5" />
    <line x1="106" y1="105" x2="106" y2="114" stroke="#d97706" stroke-width="1.5" />
  </g>
</svg>
