<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="goldGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <path id="arch512" d="M 64,310 A 192,192 0 0,1 448,310" fill="none" />
  </defs>

  <!-- Background with gold border -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad512)" />
  <rect x="8" y="8" width="496" height="496" rx="88" fill="none" stroke="url(#goldGrad512)" stroke-width="6" opacity="0.9" />

  <!-- Arched LEGACY SCHOOL Text -->
  <text font-family="'Inter', 'Arial Black', sans-serif" font-size="28" font-weight="900" fill="#fbbf24" letter-spacing="6">
    <textPath href="#arch512" startOffset="50%" text-anchor="middle">
      LEGACY SCHOOL
    </textPath>
  </text>

  <!-- Flying Peace Dove Emblem -->
  <g transform="translate(118, 96) scale(1.82)">
    <!-- Olive Branch -->
    <path d="M 88,68 Q 98,62 108,66 Q 118,72 125,70" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" />
    <path d="M 98,63 Q 102,56 106,62 C 103,66 99,66 98,63 Z" fill="#16a34a" />
    <path d="M 108,65 Q 114,58 117,64 C 114,68 109,68 108,65 Z" fill="#22c55e" />
    <path d="M 118,70 Q 124,65 127,71 C 123,74 119,74 118,70 Z" fill="#16a34a" />

    <!-- Dove Body -->
    <path d="M 72,55 C 76,46 84,46 88,52 C 92,58 90,66 82,70 C 76,73 70,70 68,64 Z" fill="#ffffff" stroke="#1e3a8a" stroke-width="2.5" />
    <!-- Beak -->
    <path d="M 88,57 L 96,62 L 87,65 Z" fill="#f59e0b" stroke="#d97706" stroke-width="1.2" />
    <!-- Eye -->
    <circle cx="82" cy="55" r="2.2" fill="#1e3a8a" />
    <!-- Wings -->
    <path d="M 64,62 C 58,40 54,20 38,10 C 35,26 40,42 46,55 C 38,42 32,32 20,24 C 22,38 28,52 36,63 C 28,52 20,44 10,40 C 14,55 24,66 34,74 C 44,82 58,82 64,74 Z"
          fill="#ffffff" stroke="#1e3a8a" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Belly -->
    <path d="M 68,64 C 62,75 52,86 38,92 C 48,96 60,94 72,86 C 80,78 84,70 82,66 Z" fill="#ffffff" stroke="#1e3a8a" stroke-width="2.5" />
    <!-- Tail -->
    <path d="M 38,92 C 26,96 12,98 2,100 C 12,104 26,102 36,98 C 24,106 14,110 4,114 C 18,114 32,108 42,100 Z"
          fill="#ffffff" stroke="#1e3a8a" stroke-width="2.5" stroke-linejoin="round" />
  </g>

  <!-- Motto -->
  <text font-family="'Inter', sans-serif" font-size="14" font-style="italic" font-weight="600" fill="#93c5fd" text-anchor="middle" x="256" y="385">
    We Strive for Your Academic and Moral Excellence
  </text>

  <!-- EduSphere Badge at Bottom -->
  <g transform="translate(256, 432)">
    <rect x="-120" y="-24" width="240" height="48" rx="24" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <text font-family="'Inter', sans-serif" font-size="20" font-weight="900" fill="#38bdf8" text-anchor="middle" y="7" letter-spacing="3">
      EDUSPHERE
    </text>
  </g>
</svg>
